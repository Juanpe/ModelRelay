name: Draft release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: make test-release
      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash Scripts/check-release.sh "$RELEASE_VERSION"
      - run: make check-style
      - run: make check-skill

  draft:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: Create draft from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          bash Scripts/check-release.sh "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          release_flags=(--draft --verify-tag)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" "${release_flags[@]}" \
            --title "ModelRelay $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
