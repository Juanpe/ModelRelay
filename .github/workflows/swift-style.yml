name: Swift style

on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".swiftformat"
      - ".swiftlint*"
      - ".editorconfig"
      - "Scripts/swift-style.sh"
      - "Makefile"
      - ".github/workflows/swift-style.yml"
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - ".swiftformat"
      - ".swiftlint*"
      - ".editorconfig"
      - "Scripts/swift-style.sh"
      - "Makefile"
      - ".github/workflows/swift-style.yml"

permissions:
  contents: read

jobs:
  style:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .tools
          key: ${{ runner.os }}-swift-style-0.55.5-0.65.1
      - run: make check-style
