name: Agent skill

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "Documentation/**"
      - "README.md"
      - "Package.swift"
      - "Sources/**"
      - "Scripts/check-skill.sh"
      - "Scripts/Tests/check-skill-tests.sh"
      - "Makefile"
      - ".github/workflows/agent-skill.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "Documentation/**"
      - "README.md"
      - "Package.swift"
      - "Sources/**"
      - "Scripts/check-skill.sh"
      - "Scripts/Tests/check-skill-tests.sh"
      - "Makefile"
      - ".github/workflows/agent-skill.yml"

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - run: make test-skill
      - run: make check-skill
